<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#954b3d" />
    <title>Dumpling Lab</title>
    <link
      rel="preload"
      href="/fonts/scto-grotesk-a-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/atelier.css?v=9" />
    <link rel="stylesheet" href="/shared-table.css?v=desktop-receipt-footer-7" />
    <script src="/menu-data.js" defer></script>
    <script src="/i18n.js" defer></script>
    <script src="/lunch-archive.js" defer></script>
    <script src="/lunch-menu.js" defer></script>
    <script src="/catalog-client.js" defer></script>
    <script src="/order-pricing.js" defer></script>
    <script src="/lunch-ui.js" defer></script>
    <script src="/error-copy.js" defer></script>
    <script src="/cart-store.js" defer></script>
    <script src="/fulfilment.js" defer></script>
    <script src="/brand/serving-motion-v1.js" defer></script>
<script src="/brand/takeaway-pickup-v5.js" defer></script>
<script src="/brand/dinein-serving-v3.js" defer></script>
    <script src="/brand/menu-depth-v1.js" defer></script>
    <script src="/brand/menu-appetite-v1.js" defer></script>
    <script src="/brand/dish-serving-v2.js" defer></script>
    <script src="/brand/pickup-slip-v1.js" defer></script>
    <script src="/addons-ui.js" defer></script>
    <link rel="stylesheet" href="/rewards-ui.css?v=20260911-3">
    <script src="/wallet-ui.js" defer></script>
    <script src="/rewards-ui.js?v=20260911-3" defer></script>
    <script src="/checkout-ui.js" defer></script>
    <script src="/shared-motion.js" defer></script>
    <script src="/micro-motion.js" defer></script>
    <script src="/receipt-motion.js" defer></script>
    <script src="/sharing-motion.js" defer></script>
    <script src="/shared-table.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="/bilingual-fit.js" defer></script>
  </head>
  <body>
    <div class="preview-notice" id="previewNotice">
      本地体验版 · 下单与呼叫不会发送到真实厨房
    </div>
    <header class="masthead">
      <a href="#menu" class="brand" aria-label="Dumpling Lab"
        ><img src="/brand/dumpling-lab-primary.png" alt="Dumpling Lab"
      /></a>
      <div class="header-actions">
        <button id="fulfilmentButton" class="fulfilment-switch" aria-haspopup="dialog"></button>
        <div id="rewardsBar" class="rewards-bar" hidden></div>
        <button id="languageButton" class="language-button" aria-label="Switch to English">EN</button>
      </div>
    </header>
    <div class="dinein-controls" id="dineinControls">
      <button id="tableButton" class="table-button"></button>
    </div>
    <div class="workspace">
      <aside class="desktop-index">
        <p class="eyebrow">THE MENU / 菜单</p>
        <nav id="sideCategories" aria-label="菜单分类"></nav>
        <div class="side-note">
          <span class="tiny-seal">饺</span>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <section class="table-line" hidden>
          <button id="connectionButton" class="connection"></button
          ><button id="planButton" class="plan-button"></button>
        </section>
        <div class="menu-toolbar">
          <div
            class="category-scroll"
            id="categoryScroll"
            role="navigation"
            aria-label="菜品分类"
          ></div>
          <button
            id="categoryButton"
            class="category-button"
            aria-label="全部分类"
          ></button
          ><button
            id="searchButton"
            class="search-button"
            aria-label="搜索菜品"
          ></button>
        </div>
        <div id="searchPanel" class="search-panel" hidden>
          <div class="search-input"
            ><span id="searchIcon"></span
            ><input
              id="searchInput"
              type="search"
              placeholder="搜索菜名、食材"
              aria-label="搜索菜名、食材"
              enterkeyhint="search"
              autocomplete="off"
            /><button id="clearSearch" aria-label="清除搜索">×</button><button id="cancelSearch" type="button">取消</button></div
          >
          <div id="filters" class="filters"></div>
        </div>
        <div id="searchSummary" class="search-summary" hidden>
          <span id="searchSummaryText" role="status" aria-live="polite" aria-atomic="true"></span>
          <button data-action="reset-search" id="resetSearchFilters">清除</button>
        </div>
        <button class="table-experience" id="tableExperience" hidden>
          <svg viewBox="0 0 90 70" aria-hidden="true">
            <ellipse cx="45" cy="23" rx="31" ry="12" />
            <path
              d="M14 23v22c0 16 62 16 62 0V23M14 34c0 16 62 16 62 0M36 11c0-10 18-10 18 0M24 18l40 10M33 13l37 10M20 24l33 9"
            />
          </svg>
          <span
            ><strong id="experienceTitle">揭笼，上桌。</strong
            ><small id="experienceCopy">转动一桌好菜 · 进入 3D</small></span
          ><span aria-hidden="true">↗</span>
        </button>
        <div id="menuList"></div>
        <footer class="colophon restaurant-footer" id="brandFooter" aria-label="Dumpling Lab">
          <dumpling-storefront-ink class="footer-storefront" role="img" aria-label="Dumpling Lab 店铺插画 / Dumpling Lab storefront illustration">
            <div class="footer-storefront-fallback">
              <img src="/brand/footer-storefront-v1.webp" alt="Dumpling Lab 红色门店的线描插画" id="footerStorefront" loading="lazy" decoding="async" width="1774" height="887" />
              <span class="footer-awning-logo" aria-hidden="true"></span>
            </div>
          </dumpling-storefront-ink>
          <div class="footer-visit">
            <span id="footerFarewell">好好吃饭，下次见。</span>
            <nav class="footer-links" aria-label="门店与菜单" id="footerNavigation">
              <a href="#main"><span id="footerTopLabel" class="sr-only">再看看菜单</span><span aria-hidden="true">↑</span></a>
            </nav>
          </div>
          <div class="footer-signoff"><span>© <span id="footerCopy">Dumpling Lab</span></span><address><a href="https://www.google.com/maps/search/?api=1&amp;query=Dumpling%20Lab%2049%20Circular%20Rd%20Singapore%20049404" target="_blank" rel="noopener noreferrer">49 Circular Rd · Singapore 049404 <span aria-hidden="true">↗</span></a></address></div>
        </footer>
      </main>
      <div class="desktop-ticket-frame"><aside class="desktop-ticket" id="desktopTicket"></aside></div>
    </div>
    <div class="table-tray">
      <div id="trayPictures" class="tray-pictures" role="list"></div>
      <button id="tray" class="tray-summary" aria-label="查看本桌点单" aria-haspopup="dialog" aria-controls="sheet">
      <span class="tray-copy"
        ><strong id="trayLabel"></strong><small id="trayCaption"></small></span
      ><span class="tray-action"
        ><span id="trayActionLabel">查看本桌</span
        ><strong class="tray-total" id="trayTotal"></strong
      ></span>
      </button>
    </div>
    <dialog id="sheet" aria-labelledby="sheetTitle">
      <div class="sheet-header">
        <span class="eyebrow" id="sheetEyebrow"></span
        ><button class="close-button" id="closeSheet" aria-label="关闭">
          ×
        </button>
      </div>
      <div id="sheetBody"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div
      id="tableActivity"
      class="table-activity"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <script type="module" src="/brand/storefront-ink-v1.js"></script>
  </body>
</html>
