<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#211a15">
<title>Dumpling Lab — Table Menu</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>

<!-- Fixed chrome: language + waiter call -->
<div id="topChrome">
  <button id="bellBtn" aria-label="Call a server">🔔</button>
  <button id="langToggle" aria-label="Language">中文</button>
</div>

<!-- The Voyage: a scroll-driven flight through the kitchen's proudest dishes -->
<section id="voyage">
  <div class="v-stage">
    <div class="glow" id="heroGlow"></div>
    <canvas id="voyageSteam"></canvas>
    <div class="v-world" id="vWorld"></div>

    <div class="v-title" id="vTitle">
      <h1>Dumpling Lab</h1>
      <p class="overline" id="heroTagline">A modern dumpling house</p>
      <p class="table-tag" id="tableTag"></p>
      <div class="v-hint">
        <span id="vHint">Scroll to be seated</span>
        <div class="v-chevron">⌄</div>
      </div>
      <button id="voyageSkip">直接看菜单 →</button>
    </div>

    <div class="v-caption" id="vCaption"></div>

    <div class="v-end" id="vEnd">
      <div class="num" id="vEndNum">THE MENU</div>
      <h2 id="vEndTitle">The Menu</h2>
      <p class="overline" id="vEndSub">Eleven small chapters</p>
    </div>
  </div>
</section>

<!-- Chapter rail -->
<nav id="rail"><div class="rail-inner" id="railInner"></div></nav>

<!-- Search & dietary filters -->
<div id="finder">
  <input id="searchBox" type="search" autocomplete="off">
  <div class="filters" id="filters"></div>
</div>

<!-- Menu chapters -->
<main id="menu"></main>
<div id="noResults" hidden></div>

<footer id="colophon">
  <p class="overline">Dumpling Lab</p>
  <p id="colophonLine">Folded by hand, daily</p>
</footer>

<!-- Bottom navigation bar -->
<nav id="navbar">
  <button class="nav-item" id="navHome"><span class="ni">⌂</span><span class="nl" id="navHomeL">首页</span></button>
  <button class="nav-item" id="navMenu"><span class="ni">☰</span><span class="nl" id="navMenuL">菜单</span></button>
  <button class="nav-item" id="navSearch"><span class="ni">⌕</span><span class="nl" id="navSearchL">搜索</span></button>
  <button class="nav-item nav-cart" id="dockCart">
    <span class="steamer-icon">
      <span class="ni">🧺</span>
      <span class="badge" id="cartBadge" hidden>0</span>
    </span>
    <span class="nl"><span id="navCartL">蒸笼</span> <span class="dock-total" id="dockTotal"></span></span>
  </button>
</nav>

<!-- Toast -->
<div id="toast" hidden></div>

<!-- Dish detail takeover -->
<div id="detail" hidden>
  <div class="detail-hero">
    <div class="glow" id="detailGlow"></div>
    <canvas id="steamCanvas"></canvas>
    <button class="close" id="detailClose" aria-label="Close">&#x2304;</button>
    <div class="detail-art" id="detailArt"></div>
    <div class="detail-caption" id="detailCaption"></div>
  </div>
  <div class="detail-body" id="detailBody"></div>
  <div class="detail-bar" id="detailBar"></div>
</div>

<!-- Cart drawer -->
<div id="cartScrim" hidden></div>
<div id="cart" hidden>
  <div class="cart-grab"></div>
  <h2 id="cartTitle">The Steamer <span class="cn">蒸笼</span></h2>
  <p class="overline" id="cartSubtitle"></p>
  <div id="cartItems"></div>
  <div id="noteWrap">
    <p class="overline" id="noteLabel">A note to the kitchen</p>
    <textarea id="orderNote" rows="2"></textarea>
  </div>
  <div class="cart-totals" id="cartTotals"></div>
  <button class="send" id="sendOrder">
    <span id="sendLabel">Send to the kitchen</span><strong id="sendTotal"></strong>
  </button>
  <button id="cartBell">🔔</button>
  <div id="history"></div>
</div>

<!-- Order confirmation -->
<div id="ordered" hidden>
  <div class="lid-stage">
    <svg viewBox="0 0 200 120" width="230">
      <ellipse cx="100" cy="72" rx="88" ry="26" fill="#c29e75"/>
      <rect x="14" y="72" width="172" height="26" rx="8" fill="#946f4a"/>
      <ellipse cx="100" cy="98" rx="88" ry="18" fill="#7a5a3a"/>
      <g id="lid">
        <ellipse cx="100" cy="52" rx="92" ry="28" fill="#a9825b"/>
        <ellipse cx="100" cy="48" rx="40" ry="12" fill="none" stroke="#7a5a3a" stroke-width="3"/>
      </g>
    </svg>
    <canvas id="orderSteam" width="200" height="220"></canvas>
  </div>
  <h2 id="orderedTitle">It's steaming · 已送厨房</h2>
  <p id="orderedNote"></p>
  <button id="orderedDone">Back to the table · 返回</button>
</div>

<script src="menu-data.js?v=17"></script>
<script src="i18n.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
