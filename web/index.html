<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F1F0EB">
<title>Dumpling Lab · 菜单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@900&display=swap">
<link rel="stylesheet" href="panel.css?v=3">
</head>
<body>
<div id="app">
  <header id="top">
    <a class="brand" href="#" onclick="return false"><img id="brandLogo" src="brand/dumpling-lab-primary.png" alt="Dumpling Lab"><span class="m">— <span data-t="菜单|Menu">菜单</span></span></a>
    <div class="right">
      <span class="m" id="tableTop"></span>
      <button id="bellBtn" aria-label="服务员"><svg viewBox="0 0 24 24"><path d="M6.5 17h11M8 17v-5a4 4 0 0 1 8 0v5M10 20h4M12 6V4"/></svg></button>
      <button id="langBtn">EN</button>
      <button id="cartBar" class="ticket-btn" hidden><span class="seal-glyph" aria-hidden="true"></span><b id="cartCount">0</b></button>
    </div>
  </header>

  <div id="body">
    <aside id="side">
      <div class="kv">
        <span class="m" data-t="桌号|Table">桌号</span><span class="m" id="tableNow">—</span>
        <span class="m" data-t="菜品|Dishes">菜品</span><span class="m" id="dishesNow">00</span>
        <span class="m" data-t="分类|Kinds">分类</span><span class="m" id="kindsNow">00</span>
        <span class="m" data-t="币种|Currency">币种</span><span class="m">SGD</span>
      </div>
      <div><h4 data-t="分类|Kind">分类</h4><div id="kindsSlot"><div id="kinds"></div></div></div>
      <div><h4 data-t="饮食|Diet">饮食</h4><div id="dietSlot"><div class="diet" id="diet"></div></div></div>
      <div class="objet" id="objet"></div>
      <p class="m" id="heroSub" style="line-height:1.8;text-transform:none;letter-spacing:.04em;"></p>
    </aside>

    <main id="main">
      <div class="filter"><span class="lab" id="filterLab">筛选</span><input id="search" type="search" autocomplete="off" placeholder="搜索菜品…"><button id="clearBtn">清除</button><button class="random" id="randomBtn">随便来一道</button></div>
      <div id="kindsMobile"></div>
      <div id="list"></div>
      <div id="empty" hidden></div>
    </main>

    <aside id="aside">
      <div><h4 data-t="索引|Index">索引</h4><div class="kv">
        <span class="m" data-t="显示|Showing">显示</span><span class="m" id="showing">00 / 00</span>
        <span class="m" data-t="分类|Kind">分类</span><span class="m" id="kindNow">—</span>
        <span class="m" data-t="排序|Order">排序</span><span class="m" id="orderNow">—</span>
        <span class="m" data-t="匹配|Match">匹配</span><span class="m" id="matchNow">—</span>
      </div></div>
      <div><h4 data-t="排序|Order">排序</h4><div class="order" id="orderBtns"><button class="pill" data-o="menu" data-t="菜单序|Menu">菜单序</button><button class="pill" data-o="price" data-t="价格|Price">价格</button><button class="pill" data-o="az">A–Z</button></div></div>
      <div><h4 data-t="票据|Ticket">票据</h4><div class="kv">
        <span class="m" data-t="已选|Items">已选</span><span class="m" id="tItems">00</span>
        <span class="m" data-t="合计|Total">合计</span><span class="m" id="tTotal">S$0</span>
      </div><button class="pill solid" id="ticketBtn" style="margin-top:14px" data-t="查看票据|View ticket">查看票据</button></div>
      <p class="m" style="margin-top:auto;line-height:1.8;text-transform:none;letter-spacing:.04em;" data-t="现点现做。菜单上的每道菜都可以旋转查看。|Cooked to order. Every dish on this menu can be turned in your hands.">现点现做。菜单上的每道菜都可以旋转查看。</p>
    </aside>
  </div>
</div>

<div id="sheetScrim" hidden></div>
<article id="sheet" hidden><button class="close" id="sheetClose" aria-label="关闭">×</button><div id="sheetBody"></div></article>

<div id="cartScrim" hidden></div>
<aside id="cart" hidden>
  <button class="close" id="cartClose" aria-label="关闭">×</button>
  <div class="t-head"><span class="m">DL//ORDER</span><h2 id="cartTitle"></h2><p class="m" id="cartSub" style="margin-top:6px"></p></div>
  <div id="cartItems"></div>
  <div id="noteWrap"><label class="m" id="noteLabel" for="note"></label><textarea id="note" rows="2"></textarea></div>
  <div id="cartTotals"></div>
  <button id="placeOrder"><span id="orderLabel"></span><strong id="orderTotal"></strong></button>
  <button id="callWaiter"><span id="waiterLabel"></span></button>
</aside>

<div id="waiterScrim" hidden></div>
<section id="waiterSheet" hidden>
  <button class="close" id="waiterClose" aria-label="关闭">×</button>
  <h2 id="waiterTitle"></h2><p class="m" id="waiterSub" style="margin-top:6px"></p>
  <div class="m" id="waiterK" style="margin-top:18px"></div>
  <div class="reasons" id="reasons"></div>
  <button id="waiterSend" disabled></button>
</section>

<div id="done" hidden>
  <div class="slip"><div class="slip-reg"><span class="m">Dumpling Lab</span><span class="m">DL//ORDER</span></div><div class="done-mark"><span class="seal-glyph" aria-hidden="true"></span></div><h2 id="doneTitle"></h2><p id="doneNote"></p></div>
  <button id="doneBack" class="pill"></button>
</div>
<div id="toast" hidden></div>

<script src="menu-data.js?v=34"></script>
<script src="i18n.js?v=35"></script>
<script src="art.js?v=45"></script>
<script src="panel.js?v=2"></script>
</body>
</html>
