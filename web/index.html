<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e51b00">
<title>Dumpling Lab · 点餐</title>
<link rel="preload" href="fonts/scto-grotesk-a-regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/scto-grotesk-a-medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/scto-grotesk-a-light.otf" as="font" type="font/otf" crossorigin>
<script>try{if(localStorage.getItem("dl-theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=202">
</head>
<body>

<div id="splash" aria-hidden="true" hidden>
  <div class="seal"><span class="seal-glyph"></span></div>
  <div class="word">DUMPLING LAB</div>
</div>

<header id="top">
  <div class="wrap">
    <a class="brand" href="#menu" aria-label="Dumpling Lab menu">
      <img id="brandLogo" src="brand/dumpling-lab-primary.png" alt="Dumpling Lab">
    </a>
    <div class="tools">
      <button id="bellBtn" aria-label="服务员"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 17h11M8 17v-5a4 4 0 0 1 8 0v5M10 20h4M12 6V4"/></svg></button>
      <button id="themeBtn" aria-label="夜间模式">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4a8 8 0 1 0 6 12.5A9 9 0 0 1 14 4Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
      <button id="langBtn">EN</button>
    </div>
  </div>
</header>

<section id="showcase" aria-label="今日推荐">
  <div class="wrap">
    <div class="sc-stage" id="scStage">
      <span class="sc-hint" id="scHint"></span>
      <button class="sc-arrow prev" id="scPrev" aria-label="上一道"><svg viewBox="0 0 20 20"><path d="m12 4-6 6 6 6"/></svg></button>
      <button class="sc-arrow next" id="scNext" aria-label="下一道"><svg viewBox="0 0 20 20"><path d="m8 4 6 6-6 6"/></svg></button>
    </div>
    <div class="sc-copy">
      <div class="k"><span id="scKicker"></span><b id="scIndex"></b></div>
      <div>
        <div class="sc-name" id="scName"></div>
        <div class="sc-en" id="scEn"></div>
      </div>
      <div class="sc-price" id="scPrice"></div>
      <div class="sc-actions">
        <div class="sc-dots" id="scDots"></div>
        <button class="sc-add" id="scAdd"><span id="scAddLabel">加入</span><b>+</b></button>
      </div>
    </div>
  </div>
</section>

<header id="hero">
  <div class="wrap">
    <p class="hero-eyebrow" id="heroEyebrow"></p>
    <div class="hero-title-row">
      <h1 id="heroTitle">MENU</h1>
      <span class="hero-count" id="heroCount"></span>
    </div>
    <div class="hero-meta">
      <p id="heroSub"></p>
      <p class="table" id="tableTag"></p>
    </div>
    <div class="hero-register" aria-hidden="true"></div>
  </div>
</header>

<nav id="tabs"><div class="tabs-inner" id="tabsInner"></div><span id="progress"></span></nav>

<div id="finder">
  <div class="wrap">
    <div class="finder-line">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="搜索菜品…">
      </div>
      <button id="viewToggle" aria-label="切换菜单视图">
        <svg class="grid-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></svg>
        <svg class="list-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        <span>清单</span>
      </button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<main id="menu" class="wrap"></main>
<div id="empty" hidden></div>

<footer id="foot"><img src="brand/dumpling-lab-wordmark.png" alt="" aria-hidden="true"><p>Dumpling Lab · 手工现包</p></footer>

<button id="cartBar" hidden>
  <span class="cb-icon"><span class="seal-glyph" aria-hidden="true"></span><span class="cb-count" id="cartCount">0</span></span>
  <span class="cb-label" id="cartBarLabel">查看已选</span>
  <span class="cb-total" id="cartBarTotal"></span>
  <svg class="cb-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>
</button>

<button id="toTop" aria-label="回顶部">↑</button>
<div id="toast" hidden></div>

<div id="sheetScrim" hidden></div>
<div id="sheet" hidden>
  <div class="sheet-grab"></div>
  <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
  <div id="sheetBody"></div>
</div>

<div id="cartScrim" hidden></div>
<div id="cart" hidden>
  <div class="sheet-grab"></div>
  <button class="sheet-close" id="cartClose" aria-label="关闭">×</button>
  <div class="cart-head">
    <span class="cart-reg" aria-hidden="true">DL//ORDER</span>
    <h2 id="cartTitle">已选菜品</h2>
    <p class="muted" id="cartSub"></p>
  </div>
  <div id="cartItems"></div>
  <div id="noteWrap">
    <label id="noteLabel" for="note">特殊要求</label>
    <textarea id="note" rows="2" placeholder="例如：不要香菜、酱料另放"></textarea>
  </div>
  <div id="cartTotals"></div>
  <button id="placeOrder"><span id="orderLabel">确认下单</span><strong id="orderTotal"></strong></button>
  <button id="callWaiter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 17h11M8 17v-5a4 4 0 0 1 8 0v5M10 20h4M12 6V4"/></svg><span id="waiterLabel">呼叫服务员</span></button>
</div>

<div id="waiterScrim" hidden></div>
<div id="waiterSheet" hidden>
  <div class="sheet-grab"></div>
  <button class="sheet-close" id="waiterClose" aria-label="关闭">×</button>
  <h2 id="waiterTitle">呼叫服务员</h2>
  <p class="muted" id="waiterSub"></p>
  <div class="k red" id="waiterK">需要什么</div>
  <div class="reasons" id="reasons"></div>
  <button id="waiterSend" disabled>通知服务员</button>
</div>

<div id="done" hidden>
  <div class="done-slip">
    <div class="slip-reg" aria-hidden="true"><span>DUMPLING LAB</span><b>DL//ORDER</b></div>
    <div class="done-mark"><span class="seal-glyph" aria-hidden="true"></span></div>
    <h2 id="doneTitle">已下单</h2>
    <p id="doneNote"></p>
    <div class="slip-perf" aria-hidden="true"></div>
  </div>
  <button id="doneBack">返回菜单</button>
</div>

<script src="menu-data.js?v=34"></script>
<script src="i18n.js?v=34"></script>
<script src="prints.js?v=1"></script>
<script src="art.js?v=44"></script>
<script src="app.js?v=202"></script>
</body>
</html>
