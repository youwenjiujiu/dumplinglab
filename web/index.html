<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#211a15">
<title>Dumpling Lab · 点餐</title>
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>

<header id="hero">
  <div class="hero-top">
    <button id="bellBtn" aria-label="服务员">🔔</button>
    <button id="langBtn">EN</button>
  </div>
  <h1>Dumpling Lab</h1>
  <p id="heroSub">现代饺子研究所</p>
  <p class="table" id="tableTag"></p>
</header>

<nav id="tabs"><div class="tabs-inner" id="tabsInner"></div></nav>

<div id="finder">
  <input id="search" type="search" autocomplete="off" placeholder="搜索菜品…">
  <div class="filters" id="filters"></div>
</div>

<main id="menu"></main>
<div id="empty" hidden></div>

<footer id="foot"><p>Dumpling Lab · 手工现包</p></footer>

<button id="cartBar" hidden>
  <span class="cb-icon">🧺<span class="cb-count" id="cartCount">0</span></span>
  <span class="cb-label" id="cartBarLabel">查看蒸笼</span>
  <span class="cb-total" id="cartBarTotal"></span>
</button>

<button id="toTop" aria-label="回顶部">↑</button>
<div id="toast" hidden></div>

<div id="sheetScrim" hidden></div>
<div id="sheet" hidden>
  <div class="sheet-grab"></div>
  <div id="sheetBody"></div>
</div>

<div id="cartScrim" hidden></div>
<div id="cart" hidden>
  <div class="sheet-grab"></div>
  <h2 id="cartTitle">蒸笼</h2>
  <p class="muted" id="cartSub"></p>
  <div id="cartItems"></div>
  <div id="noteWrap">
    <label id="noteLabel">给厨房留句话</label>
    <textarea id="note" rows="2" placeholder="少辣、不要香菜…"></textarea>
  </div>
  <div id="cartTotals"></div>
  <button id="placeOrder"><span id="orderLabel">下单</span><strong id="orderTotal"></strong></button>
  <button id="callWaiter">🔔 <span id="waiterLabel">呼叫服务员</span></button>
</div>

<div id="done" hidden>
  <div class="done-mark">🧺</div>
  <h2 id="doneTitle">已送厨房</h2>
  <p id="doneNote"></p>
  <button id="doneBack">返回菜单</button>
</div>

<script src="menu-data.js?v=25"></script>
<script src="i18n.js?v=25"></script>
<script src="art.js?v=25"></script>
<script src="app.js?v=25"></script>
</body>
</html>
