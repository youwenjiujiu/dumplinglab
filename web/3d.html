<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dumpling Lab — 3D 试验</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 40%, #3c2b20, #211a15 70%);
    color: #decca8; font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px;
  }
  h1 { font-family: "New York", ui-serif, "Songti SC", Georgia, serif; font-weight: 500; color: #fbf9f5; font-size: 26px; }
  p.sub { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 8px; opacity: 0.8; }
  #stage {
    width: min(84vw, 420px); height: min(84vw, 420px); margin-top: 24px;
    border-radius: 28px; position: relative;
    background: radial-gradient(circle at 50% 42%, rgba(120,80,40,0.5), transparent 62%);
  }
  .hint { margin-top: 18px; font-size: 13px; opacity: 0.75; text-align: center; line-height: 1.7; }
  .cap { margin-top: 20px; font-family: "New York", ui-serif, serif; font-size: 22px; color: #fbf9f5; }
  .cap small { display:block; font-family: -apple-system, sans-serif; font-size: 12px; letter-spacing: 0.14em; color: #decca8; margin-top: 6px; }
  .pick { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pick button {
    background: rgba(246,241,231,0.08); border: 1px solid rgba(222,204,168,0.25);
    color: #decca8; border-radius: 999px; padding: 8px 14px; font-size: 12.5px;
  }
  .pick button.on { background: #decca8; color: #332216; border-color: transparent; }
</style>
</head>
<body>
  <h1>Dumpling Lab</h1>
  <p class="sub">3D 菜品 · 试验台</p>
  <div id="stage"></div>
  <div class="cap" id="cap">程序化占位 · Procedural placeholder</div>
  <p class="hint">拖动旋转 · 手机倾斜有视差 · 自动缓转<br>Drag to rotate · gyro parallax on phone</p>
  <div class="pick" id="pick"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js",
    "three/utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.js"
  }
}
</script>
<script type="module">
  import Dish3D from "./dish3d.js";

  const stage = document.getElementById("stage");
  const cap = document.getElementById("cap");
  let current = null;

  // Each entry: label, optional GLB (falls back to procedural if absent), color
  const items = [
    { id: "placeholder", label: "占位饺子", cn: "Procedural", color: 0xecd9b0, model: null },
    { id: "beef-yolk-bowl", label: "月见牛肉丼", cn: "Beef & Yolk", color: 0xb8935f, model: "models/beef-yolk-bowl.glb" },
    { id: "pork-xlb", label: "小笼包", cn: "Soup Dumplings", color: 0xf0e4c8, model: "models/pork-xlb.glb" },
  ];

  function show(item) {
    if (current) current.dispose();
    stage.innerHTML = "";
    current = Dish3D.mount(stage, { modelURL: item.model, color: item.color });
    cap.innerHTML = `${item.label} <small>${item.cn}${item.model ? "" : " · 占位（无 GLB 时的程序化模型）"}</small>`;
    [...document.querySelectorAll("#pick button")].forEach((b, i) => b.classList.toggle("on", items[i].id === item.id));
  }

  const pick = document.getElementById("pick");
  items.forEach(it => {
    const b = document.createElement("button");
    b.textContent = it.label;
    b.onclick = () => show(it);
    pick.appendChild(b);
  });
  // ?dish=<id> auto-selects for verification
  const want = new URLSearchParams(location.search).get("dish");
  show(items.find(i => i.id === want) || items[0]);
</script>
</body>
</html>
