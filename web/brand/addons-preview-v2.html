<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Dumpling Lab · 加购设计预览</title>
<link rel="stylesheet" href="/atelier.css"><link rel="stylesheet" href="/shared-table.css">
<style>
html,body{margin:0;min-height:100%;background:#efefed}body{display:block;font-family:var(--sans);color:#302a24}.preview-note{margin:0;text-align:center;padding:8px;font-size:11px;color:#777}.preview-phone{width:min(100%,420px);margin:auto;background:white;min-height:calc(100dvh - 34px);padding-bottom:94px;--order-accent:#983f32}.preview-header{height:66px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #f4f3f1}.preview-header h1{font-size:19px;margin:0;font-weight:500}.preview-header button{position:absolute;left:12px;width:44px;height:44px;font-size:28px}.preview-mode{padding:18px 20px 12px;margin:0;font-size:24px;font-weight:500;border-bottom:1px solid #efefed}.preview-mode span{position:relative}.preview-mode span:after{content:'';position:absolute;bottom:-13px;left:0;width:24px;height:3px;background:#b52f23}.preview-location{padding:18px 20px 22px}.preview-location strong{display:block;font-size:16px;font-weight:500}.preview-location p{margin:8px 0 0;color:#888;font-size:12px;line-height:1.5}.preview-summary{padding:22px 20px;border-top:8px solid #f7f7f7}.preview-summary h2{margin:0 0 24px;font-size:17px;font-weight:500}.preview-summary .checkout-lines img{background:#f4f0e9;border-radius:0;width:64px;height:64px}.preview-summary .checkout-lines strong{font-weight:400;font-size:14px}.preview-phone .addon-reference{border-top:8px solid #f7f7f7;border-bottom:8px solid #f7f7f7;margin-top:0}.preview-total{padding:22px 20px}.preview-total>div{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px;font-size:13px;color:#777}.preview-total>div:last-child{margin-bottom:0;color:#302a24;font-size:16px}.preview-dock{position:fixed;bottom:0;width:min(100%,420px);padding:16px 20px max(16px,env(safe-area-inset-bottom));background:white;border-top:1px solid #f4f3f1;z-index:2}.preview-dock button{width:100%;min-height:50px;background:#983f32;color:white;font:500 17px var(--sans);border-radius:0}.preview-dock small{display:block;text-align:center;margin-top:6px;font-size:10px;color:#888}
</style></head><body><p class="preview-note">本地设计预览 · 不会下单或扣款</p><main class="preview-phone"><header class="preview-header"><button aria-label="重新查看加购弹窗" id="previewOpen">‹</button><h1>确认订单</h1></header><h2 class="preview-mode"><span>打包自取</span></h2><section class="preview-location"><strong>Dumpling Lab</strong><p>49 Circular Rd, Singapore 049404</p></section><section class="preview-summary"><h2>本次点单</h2><div class="checkout-lines" id="previewItems"></div></section><div id="previewAddons"></div><section class="preview-total"><div><span>菜品金额（未税）</span><span id="previewNet"></span></div><div><span>内含 GST 9%</span><span id="previewTax"></span></div><div><span>应付总额</span><span id="previewTotal"></span></div></section><footer class="preview-dock"><button id="previewPay">预览，不会付款</button><small id="previewMessage">本页仅用于确认设计和加购操作</small></footer></main>
<script src="/brand/serving-motion-v1.js"></script><script src="/brand/menu-depth-v1.js"></script>
<script src="/menu-data.js"></script><script src="/lunch-archive.js"></script><script src="/lunch-menu.js"></script>
<script>
const language=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';
const tr=(zh,en)=>language==='zh'?zh:en;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bi=(zh,en)=>escapeHTML(tr(zh,en));const dish=id=>MENU.find(d=>d.id===id);const name=d=>tr(d.cn,d.name);const itemPrice=d=>d.price;const photo=d=>'/img/s/'+d.img.replace(/\.(png|jpe?g|webp)$/i,'.webp');const money=n=>'$'+n.toFixed(2);const errorText=e=>e.message;
</script><script src="/addons-ui.js"></script><script>
const order={items:[{id:'lunch-v2-mince-scallion-noodles',qty:1}]};let picker=null;
function render(){document.querySelector('#previewAddons').innerHTML=AddonUI.section(order);document.querySelector('#previewItems').innerHTML=order.items.map(i=>{const d=dish(i.id);return `<article><img src="${photo(d)}" alt=""><div><strong>${escapeHTML(name(d))}</strong><small>× ${i.qty}</small></div><b>${money(d.price*i.qty)}</b></article>`}).join('');const total=order.items.reduce((s,i)=>s+dish(i.id).price*i.qty,0),net=Math.round(total/1.09*100)/100;document.querySelector('#previewNet').textContent=money(net);document.querySelector('#previewTax').textContent=money(total-net);document.querySelector('#previewTotal').textContent=money(total);document.querySelector('#previewPay').textContent=`${tr('付款','PAY')} ${money(total)}`;}
function show(preselect){if(picker)return;picker=AddonUI.show(order,{host:document.body,preselect,onClose:()=>picker=null,onApply:async items=>{for(const i of items)order.items.push(i);render();document.querySelector('#previewMessage').textContent=tr('预览：已加入所选菜品，未创建订单','Preview: selection added. No order created.');}});}
document.addEventListener('click',e=>{const button=e.target.closest('[data-checkout-addons-open],[data-checkout-addon]');if(button)show(button.dataset.checkoutAddon);});document.querySelector('#previewOpen').onclick=()=>show();document.querySelector('#previewPay').onclick=()=>document.querySelector('#previewMessage').textContent=tr('这是设计预览，不会调用支付或订单接口','Design preview only. No payment or order API is called.');render();if(new URLSearchParams(location.search).has('popup'))show();
</script></body></html>
