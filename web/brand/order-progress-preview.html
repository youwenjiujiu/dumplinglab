<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>订单进度 · 本地设计预览</title>
<link rel="stylesheet" href="/atelier.css"><link rel="stylesheet" href="/shared-table.css">
<style>body{display:block;background:#f3f3f1;margin:0;padding:16px 0;color:#262626}main{width:min(100%,440px);margin:auto;background:white;padding:22px;box-sizing:border-box}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:128px}header span{font-size:12px;color:#777}h1{font:500 20px var(--sans);margin:24px 0 0}.demo-qr{display:grid;place-content:center;text-align:center;width:112px;height:112px;border:1px dashed #bbb;font-size:10px;color:#777;flex-shrink:0}.demo-note{font:11px/1.6 var(--sans);color:#777;margin-top:18px}</style>
<main><header><img src="/brand/dumpling-lab-primary.png" alt="Dumpling Lab"><span>本地设计预览</span></header><h1>订单进度 <small>Order progress</small></h1><section class="pickup-ticket" data-pickup-id="design-preview" data-stage="ready" aria-label="取餐凭证">
      <div class="pickup-number"><span lang="zh-CN">取餐号</span><small lang="en">PICKUP NUMBER</small><strong>T0061</strong></div>
      <ol class="pickup-progress" aria-label="取餐进度"><li class="is-complete" ><span class="progress-art progress-art--received" aria-hidden="true"><i class="progress-order-slip"><em class="progress-slip-logo"></em><em class="progress-slip-items"></em><em class="progress-slip-stamp"></em></i></span><span class="progress-label" lang="zh-CN">已下单</span><small lang="en">Ordered</small></li><li class="is-complete" ><span class="progress-art progress-art--preparing" aria-hidden="true"><i class="progress-steam"></i><i class="progress-pot"><em></em><em></em><em></em></i></span><span class="progress-label" lang="zh-CN">制作中</span><small lang="en">Preparing</small></li><li class="" aria-current="step"><span class="progress-art progress-art--ready" aria-hidden="true"><i class="progress-brand-bag"><em class="progress-bag-lockup"></em><em class="progress-bag-fold"></em></i></span><span class="progress-label" lang="zh-CN">待取餐</span><small lang="en">Ready</small></li><li class="" ><span class="progress-art progress-art--collected" aria-hidden="true"><i class="progress-seal"></i></span><span class="progress-label" lang="zh-CN">已取餐</span><small lang="en">Collected</small></li></ol>
      <p class="pickup-status" role="status"><b>餐已备好，请到柜台取餐</b><small>状态已更新 · 页面打开时自动刷新</small></p>
      <div class="pickup-code"><div class="demo-qr">二维码区域<br>PREVIEW ONLY</div><div><span>取餐时出示</span><small>取餐号或二维码</small><small>08 / 09 / 2026</small></div></div>
    </section><p class="demo-note">当前展示待取餐示例，不是真实订单，不会付款或发送厨房。实际订单进度由门店操作更新。</p></main>
</html>
