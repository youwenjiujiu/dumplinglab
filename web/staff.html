<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dumpling Lab · 店员端</title>
<style>
  :root{ --bg:#1a1410; --card:#2a2119; --line:#3a2f24; --sesame:#decca8; --red:#c0392b; --green:#3a7d4f; --ink:#f6f1e7; }
  *{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"PingFang SC",system-ui,sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;}
  header h1{font-size:17px;font-weight:700;letter-spacing:.02em;}
  header .st{font-size:12px;color:var(--sesame);display:flex;align-items:center;gap:6px;cursor:pointer;}
  header .dot{width:8px;height:8px;border-radius:99px;background:#888;}
  header .dot.on{background:#4caf50;box-shadow:0 0 8px #4caf50;}
  #enable{background:var(--sesame);color:#241a12;border:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;}
  #list{padding:14px;display:flex;flex-direction:column;gap:12px;}
  .pickup-check{padding:14px 18px;border-bottom:1px solid var(--line);}
  .pickup-check form{display:flex;gap:8px;margin-top:8px;}
  .pickup-check input{flex:1;min-width:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:16px;}
  .pickup-check button{padding:12px;border:0;border-radius:8px;background:var(--sesame);color:var(--bg);}
  #pickupResult{line-height:1.7;font-size:14px;margin-top:10px;}
  #pickupResult strong{font-size:30px;}
  #pickupResult button{display:block;width:100%;margin-top:12px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;animation:pop .35s cubic-bezier(.22,1.4,.5,1);}
  .item.call{border-color:var(--red);}
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
  .item .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .item .table{font-size:20px;font-weight:800;}
  .item .kind{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;}
  .kind.call{background:var(--red);color:#fff;}
  .kind.order{background:var(--green);color:#fff;}
  .item .time{font-size:12px;color:#9a8f80;}
  .item .lines{font-size:14px;line-height:1.6;color:#e8ddca;margin-top:4px;}
  .item .note{font-size:13px;color:var(--sesame);margin-top:6px;font-style:italic;}
  .item .total{font-size:14px;margin-top:6px;font-weight:700;}
  .item .done{margin-top:10px;width:100%;padding:9px;border:none;border-radius:12px;background:#3a2f24;color:var(--sesame);font-size:13px;font-weight:600;}
  .item.gone{opacity:.4;}
  .empty{text-align:center;color:#6f665b;padding:60px 20px;font-size:14px;line-height:1.7;}
  #flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:1;transition:opacity .15s;}
  #flash.on{opacity:.25;}
</style>
<link rel="stylesheet" href="/catalog-admin.css">
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e7e8eb;--sesame:#952f2b;--ink:#25282d}
.order-shell header{position:static;flex-wrap:wrap;background:white;gap:14px;padding:22px 28px}.order-shell header h1{font-size:22px}.order-shell #list{max-width:1100px;margin:auto;padding:24px}.order-shell .pickup-check{padding:24px 28px;background:white}.order-shell .pickup-check form{max-width:680px}.order-shell .pickup-check button,.order-shell #enable{background:#952f2b;color:white;border-radius:7px;min-height:44px}.order-shell .item .lines{color:#444950}.order-shell .item .done{background:#fbefee;color:#952f2b;min-height:44px}.order-shell .empty{color:#72767d}.order-shell .item .time{color:#72767d}.order-shell .item .note{color:#72767d}.order-shell .pickup-check input{background:white}.order-shell #pickupResult{max-width:680px}
.order-actions{display:flex;gap:10px;margin-top:10px}.order-shell .item .order-actions .done{margin-top:0;flex:1;width:auto}.order-actions .clear-table{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:13px;font-weight:600}.order-actions button:active{transform:scale(.97)}.clear-result{font-size:13px;line-height:1.6;margin-top:8px}.clear-result:empty{display:none}
@media(max-width:600px){.order-shell header,.order-shell .pickup-check{padding:18px 16px}.order-shell #list{padding:16px}.order-shell .pickup-check form{flex-wrap:wrap}.order-shell .pickup-check input{flex-basis:100%}}
</style>
</head>
<body>
<a class="skip-link" href="#ordersMain">跳至订单工作区</a>
<aside class="sidebar">
  <a class="brand" href="/staff.html"><img src="/brand/dumpling-lab-primary.png" alt="Dumpling Lab"><span>商家工作台</span></a>
  <p class="nav-label">日常运营</p>
  <nav aria-label="后台导航">
    <a href="/staff.html" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z M9 7h6 M9 11h6 M9 15h3"/></svg>订单工作台<span class="nav-arrow" aria-hidden="true">↗</span></a>
    <a href="/catalog-admin.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>菜品管理</a>
    <a href="/catalog-admin.html#inventory"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z M3 7l9 4 9-4 M12 11v10"/></svg>库存管理</a>
    <a href="/catalog-admin.html#wallet">充值与余额 <span aria-hidden="true">↗</span></a><a href="/catalog-admin.html#rewards">积分与兑换 <span aria-hidden="true">↗</span></a><a href="/catalog-admin.html#history"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8 M3 4v6h6 M12 7v5l3 2"/></svg>操作记录</a>
  </nav>

<div class="shell order-shell" id="ordersMain" tabindex="-1">
<div id="flash"></div>
<header>
  <h1>订单工作台</h1>
  <div class="st"><span class="dot" id="dot"></span><span id="stTxt">连接中…</span></div>
  <button id="enable">开启响铃</button>
</header>
<section class="pickup-check"><label for="endTable">结束就餐 / 清台</label><form id="endTableForm"><input id="endTable" required maxlength="12" placeholder="桌号，例如 C2" aria-label="桌号"><input id="endGroup" required maxlength="16" value="A" aria-label="点餐组" style="max-width:72px"><button type="submit">清台</button></form><div id="endTableResult" role="status" aria-live="polite"></div></section>
<section class="pickup-check"><label for="pickupInput">核验取餐码</label><form id="pickupForm"><input id="pickupInput" autocomplete="off" placeholder="扫描顾客二维码，或粘贴取餐码链接"><button>核验</button></form><div id="pickupResult" role="status" aria-live="polite"></div></section>
<div id="list"><div class="empty" id="empty">等待顾客呼叫与下单…<br><small>把这个页面开在收银台的手机或平板上</small></div></div>

</div>
<script>
const list=document.getElementById("list");
const dot=document.getElementById("dot"), stTxt=document.getElementById("stTxt");
let soundOn=false, ctx, cursor=0, firstLoad=true;
const seen=new Set(), cards=new Map();
let staffPassword=sessionStorage.getItem("dl-staff-password")||"";
let authCancelled=false;

const authValue=password=>{
  const bytes=new TextEncoder().encode(`staff:${password}`);
  return "Basic "+btoa(String.fromCharCode(...bytes));
};
async function staffFetch(url,options={},mayPrompt=true){
  const headers={...(options.headers||{})}; if(staffPassword) headers.authorization=authValue(staffPassword);
  let response=await fetch(url,{...options,headers});
  if(response.status!==401||!mayPrompt||authCancelled) return response;
  staffPassword=""; sessionStorage.removeItem("dl-staff-password");
  const entered=prompt("请输入店员密码");
  if(entered===null){ authCancelled=true; return response; }
  staffPassword=entered; sessionStorage.setItem("dl-staff-password",entered);
  response=await staffFetch(url,options,false);
  if(response.status===401){ staffPassword=""; sessionStorage.removeItem("dl-staff-password"); }
  return response;
}
dot.parentElement.onclick=()=>{ authCancelled=false; staffPassword=""; sessionStorage.removeItem("dl-staff-password"); stTxt.textContent="等待登录…"; };

async function clearTable(table,group,result,button,orderId=null){
  button.disabled=true;result.textContent='核对中…';
  try{
    const current=await fetch(`/api/cart?table=${encodeURIComponent(table)}&group=${encodeURIComponent(group)}`,{cache:'no-store'});
    const snapshot=await current.json();if(!current.ok)throw Error(snapshot.error||'无法读取本桌');
    if(orderId&&!snapshot.cart.orders.some(o=>o.id===orderId))throw Error('这笔订单不属于当前就餐，请使用上方清台入口核对桌号。');
    if(snapshot.cart.paymentPending)throw Error('本组有未确认付款，请先核实，暂不能清台。');
    if(!confirm(`确认 ${table} 桌 ${group} 组客人已离席？清台后，新客看不到本轮订单和选菜，后台账单保留。`)){result.textContent='未清台';return;}
    const response=await staffFetch('/api/online',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'end-table-session',table,group,tableSession:snapshot.cart.tableSession})});
    const out=await response.json();if(!response.ok)throw Error(out.error||'清台失败');
    result.textContent=`${table} 桌 ${group} 组已清台，可以接待下一组客人。`;
    if(orderId)button.dataset.cleared='true';
  }catch(error){result.textContent=error.message;}finally{button.disabled=button.dataset.cleared==='true';}
};

document.getElementById('endTableForm').onsubmit=async e=>{
  e.preventDefault();
  await clearTable(document.getElementById('endTable').value.trim().toUpperCase(),document.getElementById('endGroup').value.trim().toUpperCase(),document.getElementById('endTableResult'),e.target.querySelector('button'));
};

document.getElementById("enable").onclick=()=>{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  ctx.resume(); soundOn=true; ding();
  document.getElementById("enable").textContent="响铃已开 ✓";
};
function ding(times=1){
  if(!soundOn||!ctx) return;
  for(let i=0;i<times;i++){
    const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+i*0.18;
    o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1180,t+0.08);
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.17);
  }
}
function flash(){ const f=document.getElementById("flash"); f.classList.add("on"); setTimeout(()=>f.classList.remove("on"),150); }

function money(n){ return "$"+(Number.isInteger(n)?n:n.toFixed(2)); }
function esc(value){ const el=document.createElement("span"); el.textContent=String(value??""); return el.innerHTML; }
function ensureEmpty(){
  let el=document.getElementById("empty");
  if(cards.size){ el?.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="empty"; el.className="empty"; el.innerHTML="等待顾客呼叫与下单…<br><small>把这个页面开在收银台的手机或平板上</small>"; list.append(el); }
}
function render(evt){
  if(!evt.id) return false;
  const signature=JSON.stringify(evt), previous=cards.get(evt.id), isNew=!seen.has(evt.id);
  if(previous?.dataset.signature===signature) return false;
  const phases=['received','preparing','ready','collected'];
  if(previous && phases.indexOf(evt.preparationStatus||'received')<phases.indexOf(previous.dataset.phase||'received')) return false;
  seen.add(evt.id); document.getElementById("empty")?.remove();
  const el=document.createElement("div");
  el.className="item "+(evt.type==="call"?"call":"order");
  el.dataset.id=evt.id;
  el.dataset.signature=signature;
  el.dataset.phase=evt.preparationStatus||'received';
  const time=new Date(evt.at).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  if(evt.type==="call"){
    el.innerHTML=`<div class="top"><span class="table">${esc(evt.table||"?")} 号桌 · ${esc(evt.group||"A")}组</span><span class="kind call">${evt.reason?`需要：${esc(evt.reason)}`:"呼叫服务员"}</span></div>
      <div class="time">${time}</div><button class="done">已处理</button>`;
  }else{
    const online=['takeaway','delivery'].includes(evt.mode);
    const heading=online ? (evt.mode==='delivery'?'外送':'打包自取') : `${esc(evt.table||'?')} 号桌 · ${esc(evt.group||'A')}组`;
    const lines=(evt.items||[]).map(it=>{
      const nm = it.name||it.id; const st = it.style?` · ${it.style}`:"";
      return `${esc(nm)}${esc(st)} ×${esc(it.qty)}${it.promo==='bogo'?'（买一赠一 · 赠送）':''}${it.note?`<br><strong>　备注：${esc(it.note)}</strong>`:''}`;
    }).join("<br>");
    el.innerHTML=`<div class="top"><span class="table">${heading}</span><span class="kind order">${online?'已付款 · ':''}新订单 #${esc(evt.no||"")}</span></div>
      <div class="time">${time}</div>
      ${evt.pickup ? `<div class="table">取餐号 ${esc(evt.pickup.number)}</div>` : ''}
      ${evt.pickup ? `<div class="note">${({received:'等待制作',preparing:'制作中',ready:'可取餐',collected:'已交餐'})[evt.preparationStatus||'received'] || '等待制作'}</div>` : ''}
      ${online?`<div class="note">${evt.fulfilment?.date ? `${esc(evt.fulfilment.date)} · ${esc(evt.fulfilment.slot)}<br>` : ''}${evt.customer?.name ? `${esc(evt.customer.name)} · ${esc(evt.customer.phone)}<br>` : ''}${esc(evt.fulfilment?.pickupAddress || [evt.customer?.address,evt.customer?.unit].filter(Boolean).join(' '))}</div>`:''}
      <div class="lines">${lines}</div>
      ${evt.note?`<div class="note">备注：${esc(evt.note)}</div>`:""}
      ${evt.pricingVersion?`<div class="time">菜品 ${money(evt.subtotal)}${evt.discount?`（已减折扣 ${money(evt.discount)}）`:''}${evt.mode==='delivery'?` · 配送费 9% ${money(evt.deliveryFee)}`:''}${evt.gst!==undefined?` · GST 9% ${money(evt.gst)}`:evt.mode==='dinein'?` · 服务费 10% ${money(evt.serviceCharge)}`:''}</div>`:''}
      <div class="total">${money(evt.total||0)}</div>
      <div class="order-actions"><button class="done">${evt.pickup ? (evt.preparationStatus==='ready' ? '确认已交餐' : evt.preparationStatus==='preparing' ? '标记可取餐' : '开始制作') : '已完成'}</button>${!online&&evt.table ? '<button class="clear-table">清台</button>' : ''}</div><div class="clear-result" role="status" aria-live="polite"></div>`;
  }
  const clearButton=el.querySelector('.clear-table');
  if(clearButton)clearButton.onclick=()=>clearTable(evt.table,evt.group||'A',el.querySelector('.clear-result'),clearButton,evt.id);
  el.querySelector(".done").onclick=async()=>{
    const button=el.querySelector(".done"), label=button.textContent; button.disabled=true; button.textContent="保存中…";
    try{
      const next=evt.pickup && evt.preparationStatus!=='ready' ? (evt.preparationStatus==='preparing'?'ready':'preparing') : null;
      const res=await staffFetch(next ? '/api/order-status' : '/api/resolve',{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:evt.id,...(next?{status:next}:{})})});
      const out=await res.json().catch(()=>({})); if(!res.ok||!out.ok) throw new Error(out.error||`HTTP ${res.status}`);
      if(next){ if(cards.has(evt.id)) render(out.order); return; }
      const current=cards.get(evt.id); cards.delete(evt.id); current?.remove(); ensureEmpty();
    }catch(error){ button.disabled=false; button.textContent=label; stTxt.textContent="未能标记完成"; }
  };
  cards.set(evt.id,el);
  if(previous) previous.replaceWith(el); else list.prepend(el);
  return isNew;
}

async function poll(){
  try{
    const res=await staffFetch(`/api/feed?after=${Math.max(0,cursor-1)}`,{cache:"no-store"});
    const out=await res.json().catch(()=>({})); if(!res.ok) throw new Error(out.error||`HTTP ${res.status}`);
    const active=new Set(out.activeIds||[]);
    for(const [id,el] of cards) if(!active.has(id)){ cards.delete(id); el.remove(); }
    for(const evt of out.events||[]) if(render(evt)&&!firstLoad){ ding(evt.type==="call"?3:1); flash(); if(navigator.vibrate) navigator.vibrate(evt.type==="call"?[100,60,100]:60); }
    cursor=Math.max(cursor,Number(out.cursor)||0); firstLoad=false; ensureEmpty();
    dot.classList.add("on"); stTxt.textContent="已连接";
  }catch(error){ dot.classList.remove("on"); stTxt.textContent=error.message||"重连中…"; }
  setTimeout(poll,2000);
}
async function inspectPickup(value) {
  const result=document.getElementById('pickupResult');
  let credential=value.trim();
  try { if(credential.includes('#')) credential=new URLSearchParams(new URL(credential).hash.slice(1)).get('pickup')||''; } catch { credential=''; }
  const match=/^([a-f0-9-]{36})\.([a-f0-9]{32})$/.exec(credential);
  if(!match){result.textContent='取餐码格式不正确';return;}
  const input={id:match[1],code:match[2]};
  result.textContent='核验中…';
  try {
    const response=await staffFetch('/api/pickup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...input,action:'inspect'})});
    const out=await response.json();if(!response.ok||!out.ok)throw new Error(out.error||'核验失败');
    const o=out.order;
    result.innerHTML=`<strong>${esc(o.pickup.number)}</strong> · ${esc(o.pickup.date)}<br>${o.collectedAt?'此订单已取餐，请勿重复交餐':'已付款 · 请核对菜品后交餐'}<br>${o.items.map(i=>`${esc(i.name)} × ${esc(i.qty)}`).join('<br>')}${o.collectedAt?'':'<button id="collectPickup">确认交餐</button>'}`;
    const button=document.getElementById('collectPickup');
    if(button)button.onclick=async()=>{
      button.disabled=true;
      try {
        const res=await staffFetch('/api/pickup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...input,action:'collect'})});
        const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'保存失败');
        result.textContent=`${data.order.pickup.number} 已取餐`;
      }catch(e){button.disabled=false;stTxt.textContent=e.message;}
    };
  }catch(e){result.textContent=e.message;}
}
document.getElementById('pickupForm').onsubmit=e=>{e.preventDefault();inspectPickup(document.getElementById('pickupInput').value);};
function pickupFromHash(){
  const value=new URLSearchParams(location.hash.slice(1)).get('pickup');
  if(!value)return;
  history.replaceState(null,'',location.pathname+location.search);
  inspectPickup(value);
}
window.addEventListener('hashchange',pickupFromHash);
pickupFromHash();
poll();
</script>
